
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "set-transformer-project"
version = "0.1.0"
description = "Set Transformer experiments and pretrained model inference"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "torchvision",
    "torch-geometric",
]

[tool.setuptools]
packages = ["model_assets"]
py-modules = [
    "baseline",
    "load_data",
    "model",
    "model_api",
    "set_transformer",
    "train",
    "transformer",
]

[tool.setuptools.package-data]
model_assets = ["*.pt"]
